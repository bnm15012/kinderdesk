<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="20" fill="#2563eb"/>
  <!-- Graduation cap: mortarboard top -->
  <polygon points="50,22 85,40 50,54 15,40" fill="white"/>
  <!-- Cap base / hat brim -->
  <rect x="35" y="52" width="30" height="5" rx="2" fill="white"/>
  <!-- Tassel string -->
  <line x1="85" y1="40" x2="85" y2="58" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <circle cx="85" cy="61" r="4" fill="#fbbf24"/>
  <!-- Diploma scroll hint underneath -->
  <rect x="38" y="57" width="24" height="18" rx="3" fill="white" opacity="0.9"/>
  <line x1="43" y1="63" x2="57" y2="63" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
  <line x1="43" y1="68" x2="57" y2="68" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
</svg>
